<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E232A"/>
      <stop offset="100%" stop-color="#121519"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Leaf Green Gradients -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FFC400" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Circular Base -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Glowing Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#goldGlow)"/>

  <!-- Stylized Organic Green Leaf -->
  <path d="M170 330 C130 250 160 170 230 160 C260 210 240 290 170 330 Z" fill="url(#greenGrad)"/>
  <path d="M185 300 Q200 230 220 180" stroke="#B9F6CA" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M195 240 Q180 230 165 235" stroke="#B9F6CA" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M205 270 Q220 260 235 265" stroke="#B9F6CA" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Wheat Stalks / Golden Grain Emblem -->
  <!-- Main stem -->
  <path d="M170 340 C210 360 290 350 330 270 C360 210 330 150 280 110" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
  
  <!-- Wheat Grains -->
  <!-- Top grains -->
  <path d="M280 110 C295 90 330 95 330 115 C330 135 300 135 280 110 Z" fill="url(#goldGrad)"/>
  <path d="M260 130 C240 110 245 80 265 85 C285 90 280 120 260 130 Z" fill="url(#goldGrad)"/>
  
  <!-- Mid grains -->
  <path d="M305 145 C330 130 360 145 355 165 C350 185 320 175 305 145 Z" fill="url(#goldGrad)"/>
  <path d="M285 170 C260 150 265 125 285 130 C305 135 305 160 285 170 Z" fill="url(#goldGrad)"/>
  
  <path d="M325 195 C355 185 375 210 365 230 C355 250 330 230 325 195 Z" fill="url(#goldGrad)"/>
  <path d="M305 220 C280 200 290 175 305 180 C325 185 320 210 305 220 Z" fill="url(#goldGrad)"/>
  
  <!-- Bottom grains -->
  <path d="M330 255 C355 245 370 275 355 295 C340 310 320 285 330 255 Z" fill="url(#goldGrad)"/>
  <path d="M315 275 C295 255 305 230 320 240 C335 250 330 270 315 275 Z" fill="url(#goldGrad)"/>

  <!-- Botanical Vine Accent -->
  <path d="M200 350 C260 380 340 360 380 280 C400 240 395 180 360 140" fill="none" stroke="url(#greenGrad)" stroke-width="5" stroke-dasharray="8 6" opacity="0.6"/>
</svg>
